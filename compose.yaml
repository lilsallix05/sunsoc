services:
  sunsoc:
    build: .
    ports:
      - "127.0.0.1:4891:4891"
    environment:
      SUNSOC_FACILITATOR_TOKEN: ${SUNSOC_FACILITATOR_TOKEN:-}
    volumes:
      - sunsoc-data:/app/instance
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4891/api/session', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  sunsoc-data:
